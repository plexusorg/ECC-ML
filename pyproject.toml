[project]
name = "module-ecc"
version = "0.1.0"
description = "Data and model pipeline for Module-ECC chat safety"
requires-python = ">=3.13,<3.14"
# openvino, tokenizers, torch and transformers are pinned: `uv run export` converts the models with them, and other
# versions write other graphs.
dependencies = [
    "numpy>=2.5.4",
    "openvino==2026.4.1",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "safetensors>=0.8.0",
    "tokenizers==0.23.3",
    "torch==2.14.1",
    "transformers==5.22.2",
    "wandb>=0.31.0",
]

[project.scripts]
status = "ecc.status:main"
dossier = "ecc.dossier:main"
read = "ecc.read:main"
truth = "ecc.truth:main"
labels = "ecc.labels:main"
trainset = "ecc.trainset:main"
train = "ecc.train:main"
export = "ecc.export:main"
eval = "ecc.evaluate:main"
backup = "ecc.backup:main"
restore = "ecc.restore:main"
bundle = "ecc.bundle:main"
promote = "ecc.promote:main"
replay-export = "ecc.replay:main"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ecc"
